name: Validate skill collection

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate metadata and links
        run: |
          python3 -m pip install --only-binary=:all: -r scripts/requirements-validation.txt
          python3 scripts/validate_collection.py
      - name: Run offline helper tests
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 -m unittest discover -s ui-design/scripts/tests -v
          python3 -m unittest discover -s pr-quiz/scripts/tests -v
          node pr-quiz/scripts/tests/workflow.cjs
      - name: Check changed lines for whitespace errors
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_REVISION" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_REVISION^{commit}" 2>/dev/null; then
            git diff --check "$BASE_REVISION" HEAD --
          else
            git show --format= --check HEAD --
          fi
